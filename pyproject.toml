[project]
name = "weldbox"
version = "0.2.0"
description = "Generate vendor-ready tube laser cut lists (STEP) and sheet panel DXFs for welded square-tube boxes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mason Hensley" }]
keywords = [
    "tube-laser", "laser-cutting", "welding", "fabrication", "cad",
    "step", "dxf", "build123d", "dfm", "sheet-metal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "build123d>=0.8",
    "ezdxf>=1.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/Gwaihir-Robotics/weldbox"
Repository = "https://github.com/Gwaihir-Robotics/weldbox"
Documentation = "https://github.com/Gwaihir-Robotics/weldbox/blob/main/docs/FUNCTIONALITY.md"
Issues = "https://github.com/Gwaihir-Robotics/weldbox/issues"
Changelog = "https://github.com/Gwaihir-Robotics/weldbox/releases"

[project.scripts]
weldbox = "weldbox.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weldbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: geometry tests that import OCP (deselect with '-m \"not slow\"')"]
