name: Epoxy Machine Cell
vendor: rmfg
material:
  shape: square
  size: [1.5in]
  wall: 0.120in
  family: A500
exterior:
  height: 860mm
  width: 2000mm
  depth: 660mm
# top_bottom_frames: the front/back rails of the top and bottom frames run
# solid across the full 2000mm width; the posts butt up into them.
topology: top_bottom_frames
blocking:
  # vertical supports between the bottom and top frames at rail midpoints
  - type: supports
    between: [base, top]
    at: midpoints
  # 3 evenly spaced depth-direction spanners on the top and bottom faces
  - type: spanner
    face: [top, bottom]
    axis: depth
    count: 3
# caster plates welded under the bottom frame: 4 corners + a mid pair on the
# 2000mm span (6 casters), each with a 3in-square 3/8in bolt pattern.
# For stem casters / self-leveling feet use pattern: {type: single, hole: 0.5in}.
feet:
  material: {alloy: "A36", thickness: 0.25in}
  size: 4in
  pattern: {type: square, spacing: 3in, hole: 0.41in}
  mid: {count: 1, axis: width}
quantity: 5
