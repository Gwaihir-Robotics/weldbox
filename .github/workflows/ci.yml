name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run fast tests (frame math, features, dedupe — no CAD kernel)
        run: uv run pytest -m "not slow" -q
